version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      spring-boot:
        patterns: ["org.springframework.boot*"]
      build-plugins:
        patterns: ["org.jacoco*", "com.diffplug.spotless*", "org.apache.maven.plugins*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      build-and-test:
        patterns: ["vite", "@vitejs/*", "vitest", "@vitest/*", "jsdom", "msw", "@testing-library/*", "@playwright/*"]
      lint-and-format:
        patterns: ["eslint", "@eslint/*", "eslint-plugin-*", "typescript-eslint", "prettier", "globals"]
      typescript:
        patterns: ["typescript", "openapi-typescript"]
    # Majors our toolchain cannot install yet without forcing peer dependencies (docs/frontend.md → Version
    # constraints; decisions in docs/ai/009). Remove a rule when its revisit condition holds, then let Dependabot
    # propose the bump again.
    ignore:
      # TypeScript >= 6: openapi-typescript (latest 7.13.0) declares peer typescript "^5.x" and typescript-eslint
      # (8.72.1) accepts typescript "<6.1.0". Declined: #11 (5.9.3 -> 7.0.2). Revisit when openapi-typescript supports
      # TypeScript >= 6 and typescript-eslint supports the target major.
      - dependency-name: "typescript"
        versions: [">=6"]
      # ESLint >= 10: eslint-plugin-jsx-a11y (latest 6.10.2), the accessibility rules spec 006 relies on, declares
      # peer eslint "^3 || ... || ^9". Declined: #10 (9.39.5 -> 10.14.0). Revisit when eslint-plugin-jsx-a11y
      # declares ESLint 10 support. @eslint/js is versioned with eslint.
      - dependency-name: "eslint"
        versions: [">=10"]
      - dependency-name: "@eslint/js"
        versions: [">=10"]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    # nginx: stable branches only (spec 006 AC-24, nginx:<stable>-alpine). nginx numbers stable branches with an even
    # minor and mainline branches with an odd one; Dependabot has no "odd minor" pattern, so each mainline minor is
    # listed. Stable gets the security fixes (1.30.5/1.30.6 carry those of 1.31.6/1.31.7). Declined: #17
    # (1.30-alpine -> 1.31-alpine). Revisit when a new stable ships: add the next odd minors before 1.39 is reached
    # (docs/frontend.md -> Version constraints; decision in docs/ai/013).
    ignore:
      - dependency-name: "nginx"
        versions: [">= 1.31, < 1.32", ">= 1.33, < 1.34", ">= 1.35, < 1.36", ">= 1.37, < 1.38", ">= 1.39, < 1.40"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
