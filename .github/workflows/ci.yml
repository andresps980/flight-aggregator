name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format (Spotless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check formatting
        run: ./mvnw -B -ntp spotless:check
      - name: Claude hook tests (guard-git, classify-paths)
        run: |
          bash .claude/hooks/tests/guard-git.test.sh
          bash .claude/hooks/tests/classify-paths.test.sh

  build:
    name: Build, tests & coverage
    needs: format
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Unit + integration tests, architecture rules, coverage gate
        run: ./mvnw -B -ntp verify -Dspotless.check.skip=true

      - name: Coverage summary
        if: always()
        run: |
          for csv in */target/site/jacoco/jacoco.csv; do
            [ -f "$csv" ] || continue
            bash .github/scripts/coverage-summary.sh "$csv" "${csv%%/*}"
            echo
          done > coverage.md
          # No module produced a report: let the script print its "no report" notice.
          [ -s coverage.md ] || bash .github/scripts/coverage-summary.sh no-report.csv > coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment coverage on PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --body-file coverage.md \
            || gh pr comment "${{ github.event.pull_request.number }}" --body-file coverage.md

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: '*/target/site/jacoco/'
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            */target/surefire-reports/
            */target/failsafe-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend (format, lint, types, tests & coverage, build, layout, image)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (from the lock file)
        run: npm ci --no-audit --no-fund

      - name: Generated API types match docs/api/openapi.json
        run: |
          npm run check:api \
            || { echo "::error::src/api/schema.d.ts is out of date: run 'npm run gen:api' in frontend/ and commit it"; exit 1; }

      - name: Format (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Unit tests with coverage gate (Vitest)
        run: npm run coverage -- --coverage.reporter=text --coverage.reporter=json-summary

      - name: Coverage summary
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            console.log("### Frontend coverage\n\n| Lines | Branches | Functions | Statements |\n|---:|---:|---:|---:|");
            console.log(`| ${t.lines.pct} % | ${t.branches.pct} % | ${t.functions.pct} % | ${t.statements.pct} % |`);
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Production build
        run: npm run build

      - name: Layout check in Chromium (Playwright, mocked API, 4 widths)
        run: |
          npx playwright install --with-deps chromium
          npm run test:layout

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

      - name: nginx image smoke test
        run: bash docker/smoke-test.sh

  stack-smoke:
    name: Full stack smoke (docker compose up --build, ingestion, search, e2e, outage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Layer cache for the compose builds (.github/docker-compose.build-cache.yml): a buildx builder that can export
      # to the GitHub Actions cache, and the runtime token it needs.
      - uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Stack smoke test (scripts/stack-smoke.sh, same as locally)
        env:
          STACK_SMOKE_EXTRA_COMPOSE: .github/docker-compose.build-cache.yml
          STACK_SMOKE_UP_TIMEOUT: '300'
        run: scripts/stack-smoke.sh

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: stack-smoke-compose-logs
          path: |
            target/stack-smoke/
            flight-aggregator/target/failsafe-reports/
          if-no-files-found: ignore

  dependency-review:
    name: Dependency review (vulnerable dependencies)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
