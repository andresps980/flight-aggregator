# The whole stack: PostgreSQL, Redis (search cache), the mock GDS providers, the aggregator (specs 004, 005) and the
# dashboard (spec 006).
#   docker compose up --build        then open http://localhost:3000
# The aggregator starts once PostgreSQL, Redis and gds-mock are healthy, runs its first ingestion ~10 s later and then every
# 15 min; the dashboard starts once the aggregator is healthy. Any setting can be overridden with an environment
# variable (see docs/usage.md).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: flights
      POSTGRES_USER: flights
      # Local development credentials; override for anything shared.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flights}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flights -d flights"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  # Search cache (spec 005, ADR-0022): a disposable cache, so no persistence; bounded memory with LRU eviction. Search
  # keeps working from PostgreSQL if it is down.
  redis:
    image: redis:8
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10

  gds-mock:
    build:
      context: .
      dockerfile: gds-mock/Dockerfile
    image: flight-aggregator/gds-mock:local
    ports:
      - "8081:8081"
    environment:
      # Any gds.* setting can be overridden here (see docs/usage.md), e.g.:
      GDS_WORLD_VOLUME: ${GDS_WORLD_VOLUME:-100000}
      GDS_CHAOS_DEFAULT_ERROR_RATE: ${GDS_CHAOS_DEFAULT_ERROR_RATE:-0.10}
      # "deterministic" turns latency off; with GDS_CHAOS_DEFAULT_ERROR_RATE=0 errors too (this variable beats the profile)
      SPRING_PROFILES_ACTIVE: ${GDS_MOCK_PROFILE:-default}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

  flight-aggregator:
    build:
      context: .
      dockerfile: flight-aggregator/Dockerfile
    image: flight-aggregator/flight-aggregator:local
    # -XX:+ExitOnOutOfMemoryError exits the JVM: restart it. A run cut short stays RUNNING until the next run marks
    # it ABORTED (its advisory lock died with the session).
    restart: unless-stopped
    # Longer than the 30 s the aggregator waits for a run in progress to store its state at shutdown.
    stop_grace_period: 40s
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gds-mock:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flights
      SPRING_DATASOURCE_USERNAME: flights
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-flights}
      REDIS_HOST: redis
      GDS_MOCK_URL: http://gds-mock:8081
      AGGREGATOR_INGESTION_SCHEDULE_INITIAL_DELAY: ${INGESTION_INITIAL_DELAY:-10s}
      AGGREGATOR_INGESTION_SCHEDULE_FIXED_DELAY: ${INGESTION_FIXED_DELAY:-15m}
      # Heap: see flight-aggregator/Dockerfile and SOLUTION.md; override to experiment, e.g. "-Xmx512m ..."
      JAVA_TOOL_OPTIONS: ${AGGREGATOR_JAVA_TOOL_OPTIONS:--Xmx768m -XX:+ExitOnOutOfMemoryError}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 5

  # Dashboard (spec 006): nginx serves the React build and proxies /api to the aggregator (same origin).
  frontend:
    build:
      context: ./frontend
    image: flight-aggregator/frontend:local
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    environment:
      # Demo controls panel: toggles gds-mock provider outages through its admin API (proxied under /gds-admin).
      # On by default for this local demo stack (gds-mock's admin API is published on 8081 anyway); set false to hide.
      DEMO_CONTROLS: ${DEMO_CONTROLS:-true}
    depends_on:
      flight-aggregator:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: inside the container localhost resolves to ::1 first and nginx listens on IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

volumes:
  postgres-data:
