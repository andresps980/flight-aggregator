# nginx for the dashboard (spec 006 AC-22, AC-23): serves the static build and proxies /api to the aggregator, so the
# browser talks to one origin (no CORS). Runs as the unprivileged "nginx" user: everything it writes is under /tmp.
# docker/entrypoint.sh generates /tmp/nginx/runtime.conf (DNS resolver, upstream URLs, demo-controls switch) and
# /tmp/nginx/config.json (read by the app) before starting nginx.
worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  sendfile on;

  client_body_temp_path /tmp/nginx/client_body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;

  gzip on;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    # resolver + $aggregator_url + $gds_mock_url + the /gds-admin/ locations (on or off).
    include /tmp/nginx/runtime.conf;

    # Container healthcheck (docker-compose).
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # The backend API, and nothing else of the aggregator (no /actuator, no Swagger UI). proxy_pass with a variable
    # makes nginx resolve the host at request time through Docker's DNS, so a restarted aggregator (new IP) is found
    # again; while it is down the answer is 502.
    location /api/ {
      proxy_pass $aggregator_url;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 15s;
    }

    location = /config.json {
      alias /tmp/nginx/config.json;
      include /etc/nginx/snippets/security-headers.conf;
      add_header Cache-Control "no-cache" always;
    }

    # Vite puts a content hash in every asset name: cache them for a year.
    location /assets/ {
      include /etc/nginx/snippets/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location = /index.html {
      include /etc/nginx/snippets/security-headers.conf;
      add_header Cache-Control "no-cache" always;
    }

    # Single-page app: any other path is the app itself, which reads the filters from the URL (AC-6).
    location / {
      include /etc/nginx/snippets/security-headers.conf;
      try_files $uri /index.html;
    }
  }
}
