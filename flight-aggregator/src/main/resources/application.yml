spring:
  application:
    name: flight-aggregator
  # PostgreSQL (spec 004). Local defaults; docker-compose overrides them with SPRING_DATASOURCE_* variables.
  datasource:
    url: jdbc:postgresql://localhost:5432/flights
    username: flights
    password: flights
    hikari:
      # A run holds one connection for its lock (ADR-0019) and up to max-concurrent-days write in parallel.
      maximum-pool-size: 10
  # Search cache (spec 005, ADR-0022). REDIS_HOST is set by docker-compose. Short timeouts: a slow or absent Redis
  # degrades to PostgreSQL reads instead of slowing searches down.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 100ms
      connect-timeout: 100ms
  mvc:
    problemdetails:
      enabled: true

# OpenAPI description (spec 005 AC-24, spec 006): every /api/v1 endpoint; kept in docs/api/openapi.json, from which
# the dashboard generates its TypeScript types.
springdoc:
  paths-to-match: /api/v1/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

# Provider ingestion (spec 003, ADR-0014..0016). Defaults are justified in the spec against the mock's 100-5000 ms
# latency and 10 % error rate; docs/usage.md lists every property.
aggregator:
  # gds-mock serves the three providers; GDS_MOCK_URL (set by docker-compose) points all three at it at once, since
  # environment variables cannot spell the dashed map keys.
  providers:
    mock-alpha:
      base-url: ${GDS_MOCK_URL:http://localhost:8081}
    mock-beta:
      base-url: ${GDS_MOCK_URL:http://localhost:8081}
    mock-gamma:
      base-url: ${GDS_MOCK_URL:http://localhost:8081}
      # Any resilience setting can be overridden per provider, e.g.:
      # resilience:
      #   read-timeout: 9s
  ingestion:
    horizon-days: 7
    markup-percentage: 5
    max-concurrent-days: 2
    max-concurrent-partitions: 2
    run-timeout: 10m
    # Scheduled runs (spec 004): first run shortly after startup, then 15 min after each run ends (ADR-0006).
    schedule:
      enabled: true
      initial-delay: 10s
      fixed-delay: 15m
  # Search API (spec 005): Redis cache-aside keyed by the data version; the TTL is only a safety net (ADR-0022).
  search:
    cache:
      enabled: true
      ttl: 10m
  # Day snapshots and run history (spec 004, ADR-0017).
  persistence:
    max-stale-age: 2h
    run-retention: 7d
  resilience:
    default:
      connect-timeout: 1s
      read-timeout: 6s
      attempt-timeout: 60s
      max-records-per-partition: 500000
      retry:
        max-attempts: 3
        initial-backoff: 500ms
        multiplier: 2
        jitter: 0.5
      circuit-breaker:
        sliding-window: 10
        minimum-calls: 10
        failure-rate-threshold: 80
        open-wait: 30s
        half-open-calls: 2
