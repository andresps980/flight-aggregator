# Test defaults, layered over src/main/resources/application.yml (config/ has higher precedence).
# No run starts on its own in tests; scheduling tests enable it explicitly (spec 004, AC-20).
aggregator.ingestion.schedule.enabled=false
# Spec 008: never call the live FX API from tests. A closed local port answers "connection refused" at once; tests that
# need rates point this at WireMock (RecordedFeedsSpringTest) or at gds-mock (e2e).
aggregator.exchange-rates.base-url=http://127.0.0.1:9
